<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600" role="img" aria-label="Control panel, ready: the machine needs homing before the job can start">
<title>Control panel, ready: the machine needs homing before the job can start</title>
<rect width="1024" height="600" fill="#121418"/>
<rect x="0" y="0" width="1024" height="56" rx="0" fill="#1a1d23"/>
<line x1="0" y1="56" x2="1024" y2="56" stroke="#2c313a"/>
<text x="16" y="36" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="start">PicnicPlace</text>
<text x="140" y="36" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#8b93a1" text-anchor="start">LumenPnP v4</text>
<rect x="260.0" y="12" width="118.8" height="32" rx="16" fill="#173a2d"/>
<circle cx="275.0" cy="28" r="5" fill="#2fbf86"/>
<text x="287.0" y="34" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#e7e9ee" text-anchor="start">Connected</text>
<rect x="386.8" y="12" width="118.8" height="32" rx="16" fill="#3a3122"/>
<circle cx="401.8" cy="28" r="5" fill="#f2b84b"/>
<text x="413.8" y="34" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#e7e9ee" text-anchor="start">Not homed</text>
<text x="1008" y="36" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#8b93a1" text-anchor="end">Ready</text>
<rect x="16" y="72" width="314" height="408" rx="10" fill="#1a1d23" stroke="#2c313a" stroke-width="1.5"/>
<text x="36" y="104" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#8b93a1" text-anchor="start">POSITION  (mm)</text>
<text x="36" y="164" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="#8b93a1" text-anchor="start">X</text>
<text x="310" y="164" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="44" font-weight="600" fill="#e7e9ee" text-anchor="end">    0.00</text>
<text x="36" y="234" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="#8b93a1" text-anchor="start">Y</text>
<text x="310" y="234" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="44" font-weight="600" fill="#e7e9ee" text-anchor="end">    0.00</text>
<text x="36" y="304" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="#8b93a1" text-anchor="start">Z</text>
<text x="310" y="304" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="44" font-weight="600" fill="#e7e9ee" text-anchor="end">    0.00</text>
<line x1="36" y1="358" x2="310" y2="358" stroke="#2c313a"/>
<text x="36" y="394" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#8b93a1" text-anchor="start">Left C</text>
<text x="310" y="394" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22" font-weight="500" fill="#e7e9ee" text-anchor="end">    0.0°</text>
<text x="36" y="426" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#8b93a1" text-anchor="start">Right C</text>
<text x="310" y="426" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22" font-weight="500" fill="#e7e9ee" text-anchor="end">    0.0°</text>
<text x="36" y="462" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#8b93a1" text-anchor="start">Tips: left N045, right N08</text>
<rect x="346" y="72" width="662" height="408" rx="10" fill="#1a1d23" stroke="#2c313a" stroke-width="1.5"/>
<text x="366" y="106" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#e7e9ee" text-anchor="start">Blinky rev B</text>
<text x="988" y="106" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#8b93a1" text-anchor="end">48 placements · 6 feeders</text>
<text x="366" y="152" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#8b93a1" text-anchor="start">Before the machine moves</text>
<circle cx="384" cy="194" r="16" fill="#22262e"/>
<text x="384" y="200" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f2b84b" text-anchor="middle">1</text>
<text x="414" y="190" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#e7e9ee" text-anchor="start">Home the machine</text>
<text x="414" y="214" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#8b93a1" text-anchor="start">Its position is not known since it was switched on.</text>
<circle cx="384" cy="260" r="16" fill="#22262e"/>
<text x="384" y="266" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#5c6370" text-anchor="middle">2</text>
<text x="414" y="256" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#e7e9ee" text-anchor="start">Check the board</text>
<text x="414" y="280" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#8b93a1" text-anchor="start">The board is on the staging plate, against its stops.</text>
<circle cx="384" cy="326" r="16" fill="#22262e"/>
<text x="384" y="332" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#5c6370" text-anchor="middle">3</text>
<text x="414" y="322" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#e7e9ee" text-anchor="start">Start</text>
<text x="414" y="346" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#8b93a1" text-anchor="start">The job starts with the board's fiducials.</text>
<rect x="366" y="396" width="622" height="68" rx="10" fill="#3a3122" stroke="#f2b84b" stroke-width="1.5"/>
<rect x="384" y="416" width="28" height="28" rx="6" fill="#121418" stroke="#f2b84b" stroke-width="2"/>
<text x="426" y="426" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e7e9ee" text-anchor="start">Both nozzles are level and raised</text>
<text x="426" y="448" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#8b93a1" text-anchor="start">Homing drags a low nozzle across the machine.</text>
<rect x="0" y="496" width="1024" height="104" rx="0" fill="#1a1d23"/>
<line x1="0" y1="496" x2="1024" y2="496" stroke="#2c313a"/>
<rect x="16" y="508" width="300" height="76" rx="12" fill="#22262e" stroke="#2c313a" stroke-width="2"/>
<text x="166.0" y="542.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#5c6370" text-anchor="middle">Home</text>
<text x="166.0" y="568.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#5c6370" text-anchor="middle">tick the check first</text>
<rect x="332" y="508" width="360" height="76" rx="12" fill="#22262e" stroke="#2c313a" stroke-width="2"/>
<text x="512.0" y="542.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#5c6370" text-anchor="middle">Start</text>
<text x="512.0" y="568.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#5c6370" text-anchor="middle">home first</text>
<rect x="708" y="508" width="300" height="76" rx="12" fill="#22262e" stroke="#2c313a" stroke-width="2"/>
<text x="858.0" y="555.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#5c6370" text-anchor="middle">Stop</text>
</svg>
