# Example picnicd configuration. Run with: picnicd --config picnicd.example.toml
# All values shown are the defaults unless noted. Units: millimeters, degrees, seconds.

[server]
host = "127.0.0.1"   # Loopback only. Any other address requires `token`.
port = 7420
# token = "change-me-to-a-long-random-secret"
# studio_dir = "../studio/dist"   # Serve the built Studio GUI at http://host:port/

[presence]
grace_period_s = 5.0       # Last client gone this long: running jobs pause.
heartbeat_timeout_s = 6.0  # Silent clients are disconnected after this long.

[data]
# dir = "~/.local/share/picnicplace"   # The parts library and other data. Default:
                                       # $XDG_DATA_HOME/picnicplace, else this.

[machine]
# "simulator": no hardware. "marlin": a real machine on marlin.port.
# "fake-marlin": the real Marlin driver talking to a built-in fake LumenPnP firmware.
driver = "simulator"
profile = "lumenpnp-v4.1"    # Built-in profile ID ("lumenpnp-v4.1", "lumenpnp-v4.2"), or a
                             # path to a profile TOML file.
sim_time_scale = 1.0       # Simulator and fake firmware: 10 runs ten times faster.
# Simulator and fake firmware: the feeder slots (by number) that hold a Photon feeder.
# sim_feeders = [1, 2, 3, 4, 5, 26]
# Simulator: feeder rails off the profile's place, to try rail calibration (by feeder bank
# ID: X and Y in mm, and a turn in degrees about its first slot).
# sim_rail_error = { front = [4.0, -2.5, 0.4], back = [-3.0, 5.0, -0.3] }
# Simulator: cameras off the profile, to try camera calibration: the top camera's true
# field of view as a multiple of the profile's, and the bottom camera's place and focus
# height (X, Y, and focus, in mm).
# sim_top_camera_scale = 1.05
# sim_bottom_camera_error = [-0.8, 0.5, -0.4]
# Simulator: nozzles off the profile's offsets (by nozzle ID, X and Y in mm), the datum
# board's top off the profile's height (mm, up positive), and a 6 mm paper disc lying at
# X, Y on the bed, to try calibrating the nozzle offsets.
# sim_nozzle_offset_error = { N1 = [0.4, -0.25], N2 = [-0.15, 0.3] }
# sim_nozzle_z_error = { N2 = 0.8 }   # N2's tip 0.8 mm longer than the profile's
# sim_tip_z_error = { N14 = 0.6 }     # the N14 tip 0.6 mm longer, on whichever nozzle
# sim_vacuum_levels = { N1 = [0.3, 0.5] }   # N1's vacuum open and holding a part, as fractions
#                                          # of its sensor's range: a weak pump
# sim_datum_height_error = 0.3
# sim_calibration_disc = [217.0, 94.5]
# Simulator: a board's top on the staging plates, and the tops of parts in feeders,
# strips, and trays, off the profile's or the setup's heights (mm, up positive), to try
# finding heights by touch.
# sim_board_height_error = 0.6
# sim_part_height_error = -0.4
speed_scale = 1.0          # Cap moves at this fraction of full speed. Use 0.25 when
                           # bringing up a machine. Homing speed is the firmware's.
# How picks are kept centered on the parts (a run or a single pick can choose again):
# "top": the top camera finds each tape pocket from its sprocket holes before the pick.
# "bottom": no look first; each feeder's picks move by how far off the nozzle's center
#           the bottom camera saw its earlier parts.
# "off": pick where the feeder setup says.
# "auto": "bottom", with the top camera on each feeder's first pick in a run, until it
#         has learned something, and after an empty pick or a part well off center.
pick_correction = "top"
# Find heights by touch: with suction on, a nozzle steps down until the vacuum seals. The
# board's top on a fiducial at the start of each run, and the top of the parts in each
# feeder, strip, and tray on the first pick from it (kept with that feeder and part, and
# found again after an empty pick or a change of nozzle tip). Off: the job's or the
# profile's board height, and the profile's or the setup's pick heights.
sniff_heights = true

# Places you choose for this machine: where rejected parts are dropped, and where the
# head waits. Easier: set them in the Studio (Machine workspace, Calibration panel) by
# centering the top camera on them; the core keeps those in local-profile.json in its
# data directory, and they win over these. These values are from one LumenPnP.
# [[machine.locations]]
# id = "discard"
# label = "Discard"
# kind = "discard"
# position = { x = 157.751, y = 112.758 }
#
# [[machine.locations]]
# id = "park"
# label = "Park"
# kind = "park"
# position = { x = 389.292, y = 421.551 }

[machine.marlin]
# port = "/dev/ttyACM0"    # Required for driver = "marlin".
baud = 115200
# variant = "vacuum-24bit" # Firmware variant from the profile. LumenPnP: "stock" (default)
                           # or "vacuum-24bit" for firmware patched to read 24-bit vacuum.
connect_wait_s = 3.0       # Wait after opening the port while the board boots.
command_timeout_s = 10.0

# The flight recorder keeps every frame vision looks at and what the machine does, to send
# to PicnicPlace's developers (see the guide: Send a flight recording).
[recorder]
record_runs = false        # Record every job run (a run can also ask for it).
keep = 10                  # Keep at most this many recordings,
max_mb = 5000              # and at most this many megabytes of them; older ones go.

# Cameras, by ID from the machine profile ("top" and "bottom" on the LumenPnP). Cameras
# left out are simulated with the simulator and fake-marlin drivers, and off otherwise.
# Find stable device paths with: ls /dev/v4l/by-id/ (or run picnicplace-probe).
#
# PicnicPlace shows camera images as you see the machine from the front, like the
# machine view. On a real LumenPnP v4.1 the top camera needed flip_x and flip_y (checked
# by jogging, and board fiducials then fit to 0.06 mm), and the bottom camera flip_y (not
# yet checked). Check yours: with the top camera, jog with the Right arrow and the
# picture should slide left (the head moves right over a still bed); jog Back and it
# should slide down. The bottom camera looks up at a nozzle: jog Right and the nozzle
# should move right in the picture, and Back, up.
#
# [cameras.top]
# source = "device"          # "device", "synthetic", or "none"
# device = "/dev/v4l/by-id/usb-..._LumenPnP_Top-video-index0"
# width = 1920
# height = 1080
# fps = 30
# flip_x = true
# flip_y = true
# rotation = 0.37            # degrees counterclockwise, after flips
#
# [cameras.bottom]
# source = "device"
# device = "/dev/v4l/by-id/usb-..._LumenPnP_Bottom-video-index0"
# flip_y = true
# rotation = 0.09
