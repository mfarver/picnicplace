# LumenPnP v4 machine profile.
#
# PROVISIONAL: the layout, offsets, and I/O below are estimates from public information,
# not measurements. They are close enough to develop the machine view against the
# simulator, and will be replaced with values from a real v4 (its OpenPnP machine.xml and
# a firmware session log).
#
# Units: millimeters, degrees, seconds. X increases to the right, Y toward the back.
# The head position is the center of the top camera; nozzle offsets are relative to it.

id = "lumenpnp-v4"
name = "LumenPnP v4"
provisional = true

bed = { x_min = -20, y_min = -20, x_max = 470, y_max = 420 }
work_area = { x_min = 20, y_min = 85, x_max = 420, y_max = 315 }

# Both nozzles share the Z motor: N1 goes down as Z decreases, N2 as Z increases.
# Z = 0 has both nozzles at the top of their travel.
safe_z = -1.0

[[axes]]
name = "X"
min = 0
max = 450
max_speed = 500

[[axes]]
name = "Y"
min = 0
max = 400
max_speed = 500

[[axes]]
name = "Z"
min = -30
max = 30
max_speed = 100

[[axes]]
name = "A"
kind = "rotary"
min = -360
max = 360
max_speed = 1000

[[axes]]
name = "B"
kind = "rotary"
min = -360
max = 360
max_speed = 1000

[[nozzles]]
id = "N1"
label = "Left nozzle"
offset = { x = -22, y = -35 }
z_axis = "Z"
z_sign = 1
rotation_axis = "A"
vacuum_input = "vac_n1"
pump_output = "pump_n1"
valve_output = "valve_n1"

[[nozzles]]
id = "N2"
label = "Right nozzle"
offset = { x = 22, y = -35 }
z_axis = "Z"
z_sign = -1
rotation_axis = "B"
vacuum_input = "vac_n2"
pump_output = "pump_n2"
valve_output = "valve_n2"

[[cameras]]
id = "top"
label = "Top camera"
mount = "head"
position = { x = 0, y = 0 }
looking = "down"
field_of_view = { x = 20, y = 15 }
light_output = "light_top"

[[cameras]]
id = "bottom"
label = "Bottom camera"
mount = "fixed"
position = { x = 440, y = 200 }
looking = "up"
field_of_view = { x = 24, y = 18 }
light_output = "light_bottom"

[[locations]]
id = "homing_fiducial"
label = "Homing fiducial"
kind = "homing_fiducial"
position = { x = 440, y = 120 }

[[locations]]
id = "tips"
label = "Nozzle tip holder"
kind = "tip_holder"
position = { x = 440, y = 265 }

[[locations]]
id = "discard"
label = "Discard"
kind = "discard"
position = { x = 440, y = 305 }

[[feeder_banks]]
id = "front"
label = "Front rail"
first_pick = { x = 40, y = 50 }
pitch = { x = 15, y = 0 }
count = 24
width = 13
length = 100
rotation = 90

[[feeder_banks]]
id = "back"
label = "Back rail"
first_pick = { x = 40, y = 350 }
pitch = { x = 15, y = 0 }
count = 24
width = 13
length = 100
rotation = -90

[[inputs]]
id = "home_x"
label = "X home"
kind = "digital"
role = "home"
axis = "X"

[[inputs]]
id = "home_y"
label = "Y home"
kind = "digital"
role = "home"
axis = "Y"

[[inputs]]
id = "home_z"
label = "Z home"
kind = "digital"
role = "home"
axis = "Z"

[[inputs]]
id = "vac_n1"
label = "N1 vacuum"
kind = "analog"
role = "vacuum"
unit = "kPa"
range = { min = 0, max = 80 }
threshold = 30

[[inputs]]
id = "vac_n2"
label = "N2 vacuum"
kind = "analog"
role = "vacuum"
unit = "kPa"
range = { min = 0, max = 80 }
threshold = 30

[[outputs]]
id = "pump_n1"
label = "N1 pump"
role = "pump"

[[outputs]]
id = "valve_n1"
label = "N1 valve"
role = "valve"

[[outputs]]
id = "pump_n2"
label = "N2 pump"
role = "pump"

[[outputs]]
id = "valve_n2"
label = "N2 valve"
role = "valve"

[[outputs]]
id = "light_top"
label = "Top light"
role = "light"

[[outputs]]
id = "light_bottom"
label = "Bottom light"
role = "light"
