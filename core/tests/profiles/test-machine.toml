# A small, stable machine for tests: two nozzles on a shared Z, like a LumenPnP, with
# round numbers. Tests use this rather than the shipped profiles, which change as real
# machines are measured.

id = "test-machine"
name = "Test machine"

bed = { x_min = -20, y_min = -20, x_max = 470, y_max = 420 }
work_area = { x_min = 20, y_min = 85, x_max = 420, y_max = 315 }
safe_z = -1.0

[[axes]]
name = "X"
min = 0
max = 450
max_speed = 500

[[axes]]
name = "Y"
min = 0
max = 400
max_speed = 500

[[axes]]
name = "Z"
min = -30
max = 30
max_speed = 100

[[axes]]
name = "A"
kind = "rotary"
min = -360
max = 360
max_speed = 1000

[[axes]]
name = "B"
kind = "rotary"
continuous = true
min = -360
max = 360
max_speed = 1000

[[nozzles]]
id = "N1"
label = "Left nozzle"
offset = { x = -22, y = -35 }
z_axis = "Z"
z_sign = 1
rotation_axis = "A"
vacuum_input = "vac_n1"
pump_output = "pump_n1"
valve_output = "valve_n1"

[[nozzles]]
id = "N2"
label = "Right nozzle"
offset = { x = 22, y = -35 }
z_axis = "Z"
z_sign = -1
rotation_axis = "B"
vacuum_input = "vac_n2"
pump_output = "pump_n2"
valve_output = "valve_n2"

[[cameras]]
id = "top"
label = "Top camera"
mount = "head"
position = { x = 0, y = 0 }
looking = "down"
field_of_view = { x = 20, y = 15 }
light_output = "light_top"

[[cameras]]
id = "bottom"
label = "Bottom camera"
mount = "fixed"
position = { x = 440, y = 200 }
looking = "up"
field_of_view = { x = 24, y = 18 }

[[locations]]
id = "homing_fiducial"
label = "Homing fiducial"
kind = "homing_fiducial"
position = { x = 440, y = 120 }

[[inputs]]
id = "home_x"
label = "X home"
kind = "digital"
role = "home"
axis = "X"

[[inputs]]
id = "vac_n1"
label = "N1 vacuum"
kind = "analog"
role = "vacuum"
unit = "kPa"
range = { min = 0, max = 80 }
threshold = 30

[[inputs]]
id = "vac_n2"
label = "N2 vacuum"
kind = "analog"
role = "vacuum"
unit = "kPa"
range = { min = 0, max = 80 }
threshold = 30

[[outputs]]
id = "pump_n1"
label = "N1 pump"
role = "pump"

[[outputs]]
id = "valve_n1"
label = "N1 valve"
role = "valve"

[[outputs]]
id = "pump_n2"
label = "N2 pump"
role = "pump"

[[outputs]]
id = "valve_n2"
label = "N2 valve"
role = "valve"

[[outputs]]
id = "light_top"
label = "Top light"
role = "light"

[[outputs]]
id = "light_bottom"
label = "Bottom light"
role = "light"
