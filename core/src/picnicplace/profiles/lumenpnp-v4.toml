# LumenPnP v4 machine profile.
#
# Geometry, speeds, and I/O come from a working LumenPnP v4 (its OpenPnP machine.xml and a
# serial log, November 2026); see docs/hardware/lumenpnp-v4.md. Calibrated values such as
# nozzle offsets differ a little between machines and are refined by calibration.
#
# Still PROVISIONAL: the feeder rails. Photon feeder positions are not stored in OpenPnP's
# config, so the rails below are rough estimates, and the back rail overlaps the rear
# staging plate, so it is surely misplaced. The rear plate's exact position (assumed to
# butt against the camera plate) is not measured either.
#
# Units: millimeters, degrees, seconds. The origin is at the right rear corner: facing
# the machine, +X points left and +Y toward the front. view_rotation = 180 makes clients
# draw it with the front at the bottom of the screen and +X to the left.
# The head position is the center of the top camera; nozzle offsets are relative to it.

id = "lumenpnp-v4"
name = "LumenPnP v4"
provisional = true
view_rotation = 180

# The outline is drawn to cover where the nozzles can reach (64 mm in front of the camera).
bed = { x_min = -90, y_min = -75, x_max = 525, y_max = 500 }
# Where boards can go: the two staging plates (Y -27 to 213), within the top camera's
# reach (X 0 to 433, Y from 44.5) so their fiducials can be seen. Boards sit at about
# Z = -27.5.
work_area = { x_min = 0, y_min = 44.5, x_max = 433, y_max = 213 }

# Both nozzles share the Z motor: N1 goes down as Z decreases, N2 as Z increases.
# Z = 0 has both nozzles up. OpenPnP's LumenPnP config treats -15..15 as safe for travel.
safe_z = -15.0

# After G28, center the top camera on the homing fiducial and correct X/Y (as OpenPnP does).
visual_homing = true

[[axes]]
name = "X"
min = 0
max = 433
max_speed = 600

# Y homes at 0, below its lower soft limit.
[[axes]]
name = "Y"
min = 44.454
max = 487
max_speed = 500

[[axes]]
name = "Z"
min = -28.5
max = 28.5
max_speed = 400

# Rotation is not homed and turns without limit; positions like -6300 are normal.
[[axes]]
name = "A"
kind = "rotary"
continuous = true
min = -360
max = 360
max_speed = 720

[[axes]]
name = "B"
kind = "rotary"
continuous = true
min = -360
max = 360
max_speed = 720

# N1 is at -X from the camera; with +X to the left, that is the right-hand nozzle.
[[nozzles]]
id = "N1"
label = "Right nozzle"
offset = { x = -23.836, y = -64.409 }
z_axis = "Z"
z_sign = 1
rotation_axis = "A"
vacuum_input = "vac_n1"
pump_output = "pump_n1"
valve_output = "valve_n1"

[[nozzles]]
id = "N2"
label = "Left nozzle"
offset = { x = 23.344, y = -64.384 }
z_axis = "Z"
z_sign = -1
rotation_axis = "B"
vacuum_input = "vac_n2"
pump_output = "pump_n2"
valve_output = "valve_n2"

# 1920 x 1080 at 0.01075 mm/pixel at board height.
[[cameras]]
id = "top"
label = "Top camera"
mount = "head"
position = { x = 0, y = 0 }
looking = "down"
field_of_view = { x = 20.6, y = 11.7 }
light_output = "light_top"

# 1920 x 1080 at 0.0206 mm/pixel.
[[cameras]]
id = "bottom"
label = "Bottom camera"
mount = "fixed"
position = { x = 217.736, y = 153.071 }
looking = "up"
field_of_view = { x = 39.6, y = 22.3 }
light_output = "light_bottom"

# The center fiducial of the datum board (PCB-0004), mounted on a raised spacer just
# behind the bottom camera, its notched edge toward the camera: a 1.0 mm copper dot in a
# 2 mm opening of bare board, inside a reticle. OpenPnP measured it as 0.967 mm.
[[locations]]
id = "homing_fiducial"
label = "Homing fiducial"
kind = "homing_fiducial"
position = { x = 217, y = 106 }
z = -27.5
diameter = 1.0
style = "lumenpnp-datum"

# A small board in a clear holder just in front of the bottom camera, lower than the
# datum. With the datum, it gives the top camera's scale at two heights.
[[locations]]
id = "aiming_fiducial"
label = "Aiming fiducial"
kind = "fiducial"
position = { x = 217.463, y = 196.028 }
z = -31.5
diameter = 1.2

[[locations]]
id = "discard"
label = "Discard"
kind = "discard"
position = { x = 157.751, y = 112.758 }

[[locations]]
id = "park"
label = "Park"
kind = "park"
position = { x = 389.292, y = 421.551 }

# The staging plate with the camera knockout (LumenPnP Staging Plate rev 00): 600 x 120
# mm, centered on the bottom camera, M3 holes on a 15 mm checkerboard (columns 1-39,
# rows A-G), M5 holes near the corners, and a 44 mm round knockout for the camera. The
# second plate uses the same design, knockout left in.
[[staging_plates]]
id = "camera_plate"
label = "Staging plate (camera)"
center = { x = 217.736, y = 153.071 }
size = { x = 600, y = 120 }
hole_pitch = 15
hole_diameter = 3.2
hole_columns = 39
hole_rows = 7
corner_holes = [{ x = -290, y = -50 }, { x = 290, y = -50 }, { x = -290, y = 50 }, { x = 290, y = 50 }]
knockout_diameter = 44

# The second plate, toward the back (-Y) of the camera plate. Assumed to butt against
# it (no gap); not measured.
[[staging_plates]]
id = "rear_plate"
label = "Staging plate (rear)"
center = { x = 217.736, y = 33.071 }
size = { x = 600, y = 120 }
hole_pitch = 15
hole_diameter = 3.2
hole_columns = 39
hole_rows = 7
corner_holes = [{ x = -290, y = -50 }, { x = 290, y = -50 }, { x = -290, y = 50 }, { x = 290, y = 50 }]

# Estimated: see the note at the top.
[[feeder_banks]]
id = "back"
label = "Back rail"
first_pick = { x = 40, y = 30 }
pitch = { x = 15, y = 0 }
count = 24
width = 13
length = 100
rotation = 90

[[feeder_banks]]
id = "front"
label = "Front rail"
first_pick = { x = 40, y = 410 }
pitch = { x = 15, y = 0 }
count = 24
width = 13
length = 100
rotation = -90

[[inputs]]
id = "home_x"
label = "X home"
kind = "digital"
role = "home"
axis = "X"

[[inputs]]
id = "home_y"
label = "Y home"
kind = "digital"
role = "home"
axis = "Y"

[[inputs]]
id = "home_z"
label = "Z home"
kind = "digital"
role = "home"
axis = "Z"

# Vacuum sensors report signed 24-bit counts that grow more negative with more vacuum. At
# rest they read near 0; an open nozzle settles near -1,500,000. OpenPnP's nozzle tip
# settings treat -1,600,000 and below as a part held. Firmware that reports only the top
# byte is scaled to the same counts by the driver.
[[inputs]]
id = "vac_n1"
label = "N1 vacuum"
kind = "analog"
role = "vacuum"
unit = "counts"
range = { min = 0, max = -2500000 }
threshold = -1600000

[[inputs]]
id = "vac_n2"
label = "N2 vacuum"
kind = "analog"
role = "vacuum"
unit = "counts"
range = { min = 0, max = -2500000 }
threshold = -1600000

# Each nozzle has a pump and a valve on Marlin fan outputs. OpenPnP switches the pair
# together; which output is the pump and which the valve is inferred (see the notes).
[[outputs]]
id = "pump_n1"
label = "N1 pump"
role = "pump"

[[outputs]]
id = "valve_n1"
label = "N1 valve"
role = "valve"

[[outputs]]
id = "pump_n2"
label = "N2 pump"
role = "pump"

[[outputs]]
id = "valve_n2"
label = "N2 valve"
role = "valve"

[[outputs]]
id = "light_top"
label = "Top light"
role = "light"

[[outputs]]
id = "light_bottom"
label = "Bottom light"
role = "light"

# --- Marlin driver ---------------------------------------------------------------------
# G-code as observed on a LumenPnP v4 (docs/hardware/lumenpnp-v4.md).

[marlin]
expected_machine_type = "LumenPnP"
connect = [
  "G90",
  # Configure both vacuum sensors: select each through the I2C multiplexer (address 112),
  # then write 0x1B to the sensor's command register (address 109, register 48).
  "M260 A112 B1 S1", "M260 A109", "M260 B48", "M260 B27", "M260 S1",
  "M260 A112 B2 S1", "M260 A109", "M260 B48", "M260 B27", "M260 S1",
  "M113 S0",
  "M203 X2000 Y2000 Z600 A60000 B60000",
  "M201 X20000 Y20000 Z15000 A30000 B30000",
  "M205 J0.02",
]
home = ["G28"]
default_variant = "stock"

# Inferred: the PWM 180 outputs are the pumps, the full-on ones the valves.
[marlin.outputs]
pump_n1 = { on = ["M106 P1 S180"], off = ["M107 P1"] }
valve_n1 = { on = ["M106 P0 S255"], off = ["M107 P0"] }
pump_n2 = { on = ["M106 P3 S180"], off = ["M107 P3"] }
valve_n2 = { on = ["M106 P2 S255"], off = ["M107 P2"] }
light_top = { on = ["M150 P255 R255 U255 B255 S1"], off = ["M150 P0 S1"] }
light_bottom = { on = ["M150 P255 R255 U255 B255 S0"], off = ["M150 P0 S0"] }

# Stock firmware reads one byte: the top byte of the sensor's 24-bit value, scaled here
# to the same counts. Inferred; to be confirmed against stock firmware.
[marlin.inputs.vac_n1]
read = ["M260 A112 B1 S1", "M260 A109 B6 S1", "M261 A109 B1 S2"]
pattern = 'data:\s*(?P<value>-?\d+)'
sign_bits = 8
scale = 65536

[marlin.inputs.vac_n2]
read = ["M260 A112 B2 S1", "M260 A109 B6 S1", "M261 A109 B1 S2"]
pattern = 'data:\s*(?P<value>-?\d+)'
sign_bits = 8
scale = 65536

[marlin.variants.stock]
description = "Opulo's stock firmware: vacuum sensors read as 8 bits."

[marlin.variants.vacuum-24bit]
description = "Firmware patched to read the vacuum sensors as signed 24-bit values."

[marlin.variants.vacuum-24bit.inputs.vac_n1]
read = ["M260 A112 B1 S1", "M260 A109 B6 S1", "M261 A109 B3 S4"]
clear_sign_bits = true
scale = 1

[marlin.variants.vacuum-24bit.inputs.vac_n2]
read = ["M260 A112 B2 S1", "M260 A109 B6 S1", "M261 A109 B3 S4"]
clear_sign_bits = true
scale = 1
