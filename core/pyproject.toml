[project]
name = "picnicplace"
version = "0.1.0.dev0"
description = "PicnicPlace core: a network-first pick-and-place machine controller"
license = "MPL-2.0"
requires-python = ">=3.12"
authors = [{ name = "PicnicPlace contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "anyio>=4.4",
    "fastapi>=0.115",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "pydantic>=2.9",
    "uvicorn>=0.32",
    "websockets>=13",
]

[project.scripts]
picnicd = "picnicplace.cli:main"
picnicplace-fake-marlin = "picnicplace.machine.marlin.fake:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
