# LumenPnP v4.1 machine profile (v4.1 and earlier v4): PCB staging plates, with the
# bottom camera at the center of the front plate. v4.2 changed to metal plates with the
# camera near one end: its profile, lumenpnp-v4.2, extends this one.
#
# Geometry, speeds, and I/O come from a working v4.1 (its OpenPnP machine.xml and a
# serial log, November 2026) and the plate and datum board designs; see
# docs/hardware/lumenpnp-v4.md. Calibrated values such as nozzle offsets differ a little
# between machines and are refined by calibration.
#
# Still PROVISIONAL: the rear plate's exact position (assumed to butt against the camera
# plate) is not measured.
#
# Units: millimeters, degrees, seconds. +X points right and +Y toward the back, with the
# origin at the front left. The bottom camera (Y 153 of 0-487) is near the front, as on
# the machine, and N1 (at -X) is then the left nozzle, as OpenPnP names it. An earlier
# version of this profile had both axes the other way; Opulo's assembly model agrees
# with this one (see the bed below). Check by jogging: +X should move the head right and
# +Y toward the back.
# The head position is the center of the top camera; nozzle offsets are relative to it.

id = "lumenpnp-v4.1"
name = "LumenPnP v4.1"
provisional = true
x_points = "right"
y_points = "back"

# The bed outline is the frame's 600 x 600 mm. Left to right it is placed from Opulo's
# assembly model (a 2022 LumenPnP, by its bottom camera). Front to back that model does
# not fit v4.1: at Y home (0) the nozzles are 64 mm in front of the camera, at Y -64,
# beyond its frame, so the bottom camera has moved since. Here the front edge clears the
# nozzles at Y home by about 10 mm. Not measured.
bed = { x_min = -82, y_min = -75, x_max = 518, y_max = 525 }
# Where boards go is computed: the part of the staging plates every nozzle can reach
# (the nozzles are 47 mm apart, so each reaches 47 mm farther on its own side).
# Boards sit at about Z = -27.5.

# Both nozzles share the Z motor: N1 goes down as Z decreases, N2 as Z increases.
# Z = 0 has both nozzles up. OpenPnP's LumenPnP config treats -15..15 as safe for travel.
safe_z = -15.0

# After G28, center the top camera on the homing fiducial and correct X/Y (as OpenPnP does).
visual_homing = true

# Heights are nozzle heights: 0 at the top of travel, negative going down, the same for
# both nozzles. A board's top surface on the staging plates is about -27.5 (the datum
# board's height, and the reference machine's), the top of a part in a feeder about
# -27.6 (its taught Photon slots, -27.5 to -29), and the bottom camera is focused on a
# part's bottom at -3.52 (from the reference machine's calibration).
board_height = -27.5

# Feeders talk Opulo's Photon protocol over RS-485, through the motherboard (M485).
feeder_bus = "photon"

[[axes]]
name = "X"
min = 0
max = 433
max_speed = 600

# Y homes at 0, below its lower soft limit.
[[axes]]
name = "Y"
min = 44.454
max = 487
max_speed = 500

[[axes]]
name = "Z"
min = -28.5
max = 28.5
max_speed = 400

# Rotation is not homed and turns without limit; positions like -6300 are normal.
[[axes]]
name = "A"
kind = "rotary"
continuous = true
min = -360
max = 360
max_speed = 720

[[axes]]
name = "B"
kind = "rotary"
continuous = true
min = -360
max = 360
max_speed = 720

# N1 is at -X from the camera: the left-hand nozzle.
[[nozzles]]
id = "N1"
label = "Left nozzle"
offset = { x = -23.836, y = -64.409 }
z_axis = "Z"
z_sign = 1
rotation_axis = "A"
vacuum_input = "vac_n1"
pump_output = "pump_n1"
valve_output = "valve_n1"

[[nozzles]]
id = "N2"
label = "Right nozzle"
offset = { x = 23.344, y = -64.384 }
z_axis = "Z"
z_sign = -1
rotation_axis = "B"
vacuum_input = "vac_n2"
pump_output = "pump_n2"
valve_output = "valve_n2"

# 1920 x 1080 at 0.01075 mm/pixel at board height.
[[cameras]]
id = "top"
label = "Top camera"
mount = "head"
position = { x = 0, y = 0 }
looking = "down"
field_of_view = { x = 20.6, y = 11.7 }
light_output = "light_top"

# 1920 x 1080 at 0.0206 mm/pixel.
[[cameras]]
id = "bottom"
label = "Bottom camera"
mount = "fixed"
position = { x = 217.736, y = 153.071 }
looking = "up"
field_of_view = { x = 39.6, y = 22.3 }
light_output = "light_bottom"
focus_height = -3.52

# The center fiducial of the datum board (PCB-0004), mounted on a raised spacer just in
# front of the bottom camera, its notched edge toward the camera: a 1.0 mm copper dot in a
# 2 mm opening of bare board, inside a reticle. OpenPnP measured it as 0.967 mm.
[[locations]]
id = "homing_fiducial"
label = "Homing fiducial"
kind = "homing_fiducial"
position = { x = 217, y = 106 }
z = -27.5
diameter = 1.0
style = "lumenpnp-datum"

# A separate 20 x 20 mm board (cal-fid) in a clear holder just behind the bottom camera, 4 mm lower than the datum: a 1.0 mm copper dot in a 2 mm mask opening. With the
# datum, it gives the top camera's scale at two heights. (OpenPnP measured it as 1.2 mm
# before its camera scale was calibrated at this height.)
[[locations]]
id = "aiming_fiducial"
label = "Aiming fiducial"
kind = "fiducial"
position = { x = 217.463, y = 196.028 }
z = -31.5
diameter = 1.0


# The staging plate with the camera knockout (LumenPnP Staging Plate rev 00): 600 x 120
# mm, centered on the bottom camera, M3 holes on a 15 mm checkerboard (columns 1-39,
# rows A-G), M5 holes near the corners, and a 44 mm round knockout for the camera. The
# second plate uses the same design, knockout left in.
[[staging_plates]]
id = "camera_plate"
label = "Staging plate (camera)"
center = { x = 217.736, y = 153.071 }
size = { x = 600, y = 120 }
hole_pitch = 15
hole_diameter = 3.2
hole_columns = 39
hole_rows = 7
corner_holes = [{ x = -290, y = -50 }, { x = 290, y = -50 }, { x = -290, y = 50 }, { x = 290, y = 50 }]
knockout_diameter = 44

# The second plate, behind (+Y) the camera plate. Assumed to butt against it (no gap);
# not measured.
[[staging_plates]]
id = "rear_plate"
label = "Staging plate (rear)"
center = { x = 217.736, y = 273.071 }
size = { x = 600, y = 120 }
hole_pitch = 15
hole_diameter = 3.2
hole_columns = 39
hole_rows = 7
corner_holes = [{ x = -290, y = -50 }, { x = 290, y = -50 }, { x = -290, y = 50 }, { x = 290, y = 50 }]

# Boards cannot be mounted over the bottom camera or the fiducials around it, so they go
# mostly on the rear plate. The datum board's outline is from its design (80 x 35 mm,
# reaching 25 mm from its fiducial toward the camera and 10 mm away from it); the aiming fiducial holder's size is
# estimated from a render (the board itself is 20 x 20 mm).
[[keep_outs]]
id = "datum"
label = "Datum board"
area = { x_min = 177, y_min = 96, x_max = 257, y_max = 131 }

[[keep_outs]]
id = "bottom_camera"
label = "Bottom camera"
area = { x_min = 195.7, y_min = 131, x_max = 239.8, y_max = 175.1 }

[[keep_outs]]
id = "aiming_fiducial"
label = "Aiming fiducial holder"
area = { x_min = 197.5, y_min = 188, x_max = 237.5, y_max = 204 }

# Photon feeders on two rails, 25 slots each, numbered as LumenPnP owners number them:
# 1-25 along the front rail from left to right, then 26-50 along the back rail from
# right to left. Each slot's address is programmed into the rail (the "feeder floor")
# and is the same number. Both rails feed toward the middle of the bed. Pick positions
# are fitted to the reference machine's taught slot positions, which scatter about 1 mm
# around these lines: each slot's own correction is taught in the Feeders workspace, or
# found from its feeder's fiducial.
#
# Feeder geometry is from Opulo's Photon feeder design (8 mm assembly; the 12 mm one
# shares the nose): the frame is 137 mm long plus the peel gears, 15 mm wide, and
# reaches 27.3 mm past the pick location (the middle of its 12.75 mm pick window). Its
# noses on the front rail reach over the camera plate's front edge, so boards cannot go
# there. A small board on the nose carries a 1.0 mm fiducial in a 2 mm mask opening,
# 19.15 mm along the feed from the pick location and 4.1 mm from the sprocket holes'
# line toward the pockets, with two 0.5 mm marks 2 mm to either side of it (their
# spacing encodes the feeder's width). Opulo notes the board's placement varies a
# little from feeder to feeder, so the fiducial gives the pick location roughly and
# vision on the tape finds the pocket. The design comes in 8 mm and 12 mm versions, so
# wider tape (16 mm and up) needs another kind of feeder.
[[feeder_banks]]
id = "front"
label = "Front rail"
first_pick = { x = 28.62, y = 73.24 }
pitch = { x = 15.769, y = 0 }
count = 25
first_address = 1
width = 15
length = 154
pick_to_front = 27.3
pick_height = -27.6
rotation = 90
fiducial_offset = { x = 19.15, y = -4.1 }
fiducial_diameter = 1.0
tape_widths = [8, 12]

[[feeder_banks]]
id = "back"
label = "Back rail"
first_pick = { x = 405.06, y = 388.58 }
pitch = { x = -15.758, y = 0 }
count = 25
first_address = 26
width = 15
length = 154
pick_to_front = 27.3
pick_height = -27.6
rotation = -90
fiducial_offset = { x = 19.15, y = -4.1 }
fiducial_diameter = 1.0
tape_widths = [8, 12]

[[inputs]]
id = "home_x"
label = "X home"
kind = "digital"
role = "home"
axis = "X"

[[inputs]]
id = "home_y"
label = "Y home"
kind = "digital"
role = "home"
axis = "Y"

[[inputs]]
id = "home_z"
label = "Z home"
kind = "digital"
role = "home"
axis = "Z"

# Vacuum sensors report signed 24-bit counts that grow more negative with more vacuum. At
# rest they read near 0; an open nozzle settles near -1,500,000. OpenPnP's nozzle tip
# settings treat -1,600,000 and below as a part held. Firmware that reports only the top
# byte is scaled to the same counts by the driver.
[[inputs]]
id = "vac_n1"
label = "N1 vacuum"
kind = "analog"
role = "vacuum"
unit = "counts"
range = { min = 0, max = -2500000 }
threshold = -1600000

[[inputs]]
id = "vac_n2"
label = "N2 vacuum"
kind = "analog"
role = "vacuum"
unit = "counts"
range = { min = 0, max = -2500000 }
threshold = -1600000

# Each nozzle has a pump and a valve on Marlin fan outputs. OpenPnP switches the pair
# together; which output is the pump and which the valve is inferred (see the notes).
[[outputs]]
id = "pump_n1"
label = "N1 pump"
role = "pump"

[[outputs]]
id = "valve_n1"
label = "N1 valve"
role = "valve"

[[outputs]]
id = "pump_n2"
label = "N2 pump"
role = "pump"

[[outputs]]
id = "valve_n2"
label = "N2 valve"
role = "valve"

[[outputs]]
id = "light_top"
label = "Top light"
role = "light"

[[outputs]]
id = "light_bottom"
label = "Bottom light"
role = "light"

# --- Marlin driver ---------------------------------------------------------------------
# G-code as observed on a LumenPnP v4 (docs/hardware/lumenpnp-v4.md).

[marlin]
expected_machine_type = "LumenPnP"
connect = [
  "G90",
  # Configure both vacuum sensors: select each through the I2C multiplexer (address 112),
  # then write 0x1B to the sensor's command register (address 109, register 48).
  "M260 A112 B1 S1", "M260 A109", "M260 B48", "M260 B27", "M260 S1",
  "M260 A112 B2 S1", "M260 A109", "M260 B48", "M260 B27", "M260 S1",
  "M113 S0",
  "M203 X2000 Y2000 Z600 A60000 B60000",
  "M201 X20000 Y20000 Z15000 A30000 B30000",
  "M205 J0.02",
]
# G28 lowers N1 until N2 reaches the Z switch, then brings the nozzles back to level. Some
# firmware calls that Z = 0, and some Z = 31.5 (OpenPnP's LumenPnP frame: Z 0 to 63). This
# profile calls level Z = 0, so G92 renames it, whichever the firmware reported. Without it, the lift to safe Z drives
# N1 all the way down (seen on a real v4.1, November 2026); the core also checks home_z.
home = ["G28", "G92 Z0"]
# Send a Photon packet as hex; the reply comes back as "rs485-reply: <hex>" or
# "rs485-reply: TIMEOUT".
rs485 = "M485"
default_variant = "stock"

# Inferred: the PWM 180 outputs are the pumps, the full-on ones the valves.
[marlin.outputs]
pump_n1 = { on = ["M106 P1 S180"], off = ["M107 P1"] }
valve_n1 = { on = ["M106 P0 S255"], off = ["M107 P0"] }
pump_n2 = { on = ["M106 P3 S180"], off = ["M107 P3"] }
valve_n2 = { on = ["M106 P2 S255"], off = ["M107 P2"] }
light_top = { on = ["M150 P255 R255 U255 B255 S1"], off = ["M150 P0 S1"] }
light_bottom = { on = ["M150 P255 R255 U255 B255 S0"], off = ["M150 P0 S0"] }

# Stock firmware reads one byte: the top byte of the sensor's 24-bit value, scaled here
# to the same counts. Inferred; to be confirmed against stock firmware.
[marlin.inputs.vac_n1]
read = ["M260 A112 B1 S1", "M260 A109 B6 S1", "M261 A109 B1 S2"]
pattern = 'data:\s*(?P<value>-?\d+)'
sign_bits = 8
scale = 65536

[marlin.inputs.vac_n2]
read = ["M260 A112 B2 S1", "M260 A109 B6 S1", "M261 A109 B1 S2"]
pattern = 'data:\s*(?P<value>-?\d+)'
sign_bits = 8
scale = 65536

[marlin.variants.stock]
description = "Opulo's stock firmware: vacuum sensors read as 8 bits."

[marlin.variants.vacuum-24bit]
description = "Firmware patched to read the vacuum sensors as signed 24-bit values."

[marlin.variants.vacuum-24bit.inputs.vac_n1]
read = ["M260 A112 B1 S1", "M260 A109 B6 S1", "M261 A109 B3 S4"]
clear_sign_bits = true
scale = 1

[marlin.variants.vacuum-24bit.inputs.vac_n2]
read = ["M260 A112 B2 S1", "M260 A109 B6 S1", "M261 A109 B3 S4"]
clear_sign_bits = true
scale = 1
