# Example picnicd configuration. Run with: picnicd --config picnicd.example.toml
# All values shown are the defaults unless noted. Units: millimeters, degrees, seconds.

[server]
host = "127.0.0.1"   # Loopback only. Any other address requires `token`.
port = 7420
# token = "change-me-to-a-long-random-secret"
# studio_dir = "../studio/dist"   # Serve the built Studio GUI at http://host:port/

[presence]
grace_period_s = 5.0       # Last client gone this long: running jobs pause.
heartbeat_timeout_s = 6.0  # Silent clients are disconnected after this long.

[data]
# dir = "~/.local/share/picnicplace"   # The parts library and other data. Default:
                                       # $XDG_DATA_HOME/picnicplace, else this.

[machine]
# "simulator": no hardware. "marlin": a real machine on marlin.port.
# "fake-marlin": the real Marlin driver talking to a built-in fake LumenPnP firmware.
driver = "simulator"
profile = "lumenpnp-v4.1"    # Built-in profile ID, or a path to a profile TOML file.
sim_time_scale = 1.0       # Simulator and fake firmware: 10 runs ten times faster.
# Simulator and fake firmware: the feeder slots (by number) that hold a Photon feeder.
# sim_feeders = [1, 2, 3, 4, 5, 26]
speed_scale = 1.0          # Cap moves at this fraction of full speed. Use 0.25 when
                           # bringing up a machine. Homing speed is the firmware's.
# How picks are kept centered on the parts (a run or a single pick can choose again):
# "top": the top camera finds each tape pocket from its sprocket holes before the pick.
# "bottom": no look first; each feeder's picks move by how far off the nozzle's center
#           the bottom camera saw its earlier parts.
# "off": pick where the feeder setup says.
pick_correction = "top"

# Places you choose for this machine: where rejected parts are dropped, and where the
# head waits. These values are from one LumenPnP; set your own.
# [[machine.locations]]
# id = "discard"
# label = "Discard"
# kind = "discard"
# position = { x = 157.751, y = 112.758 }
#
# [[machine.locations]]
# id = "park"
# label = "Park"
# kind = "park"
# position = { x = 389.292, y = 421.551 }

[machine.marlin]
# port = "/dev/ttyACM0"    # Required for driver = "marlin".
baud = 115200
# variant = "vacuum-24bit" # Firmware variant from the profile. LumenPnP: "stock" (default)
                           # or "vacuum-24bit" for firmware patched to read 24-bit vacuum.
connect_wait_s = 3.0       # Wait after opening the port while the board boots.
command_timeout_s = 10.0

# Cameras, by ID from the machine profile ("top" and "bottom" on the LumenPnP). Cameras
# left out are simulated with the simulator and fake-marlin drivers, and off otherwise.
# Find stable device paths with: ls /dev/v4l/by-id/ (or run picnicplace-probe).
#
# PicnicPlace shows camera images as you see the machine from the front, like the
# machine view. On a LumenPnP that is turned 180 degrees from OpenPnP's images (+Y up),
# so the values below are OpenPnP's flips turned 180 degrees: the top camera needs no
# flip (OpenPnP: X and Y), the bottom camera flip_y (OpenPnP: X). Check yours: jog with
# the Right arrow and the picture should slide left (the head moves right over a still
# bed); jog Back and it should slide down.
#
# [cameras.top]
# source = "device"          # "device", "synthetic", or "none"
# device = "/dev/v4l/by-id/usb-..._LumenPnP_Top-video-index0"
# width = 1920
# height = 1080
# fps = 30
# rotation = 0.37            # degrees counterclockwise, after flips
#
# [cameras.bottom]
# source = "device"
# device = "/dev/v4l/by-id/usb-..._LumenPnP_Bottom-video-index0"
# flip_y = true
# rotation = 0.09
